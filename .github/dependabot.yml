# Proposes version bumps of the pipeline image's inputs as PRs (planning#4). Before merging, a bump
# must pass CI and, on the data LXC, give the same full graph (canonical_sha256 in
# out/internal/manifest.json) unless the PR says why it changes.
version: 2
updates:
  - package-ecosystem: docker          # base images in Dockerfile (pinned by digest)
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependency-updates"]
    ignore:
      # PostgreSQL stays on major 16, the research database's version (planning#26); PostGIS
      # minors within 16-* are fine
      - dependency-name: "postgis/postgis"
        versions: [">= 17"]
      # Java stays 17: Ontop 5.5 and its jar set were verified with it
      - dependency-name: "eclipse-temurin"
        versions: [">= 18"]
      # the Maven image only fetches jars at build time, and Dependabot swaps its JDK suffix
      # (…-temurin-17 → …-temurin-26): bump it by hand
      - dependency-name: "maven"
  - package-ecosystem: pip             # docker/requirements.txt (rdflib, pyshacl + dependencies, hashes)
    directory: "/docker"
    schedule:
      interval: weekly
    labels: ["dependency-updates"]
  - package-ecosystem: maven           # mapping/pom.xml (Ontop CLI, PostgreSQL JDBC driver)
    directory: "/mapping"
    schedule:
      interval: weekly
    labels: ["dependency-updates"]
  - package-ecosystem: maven           # shacl/pom.xml (Apache Jena command-line tools: SHACL)
    directory: "/shacl"
    schedule:
      interval: weekly
    labels: ["dependency-updates"]
  - package-ecosystem: docker-compose  # deploy/database/docker-compose.yml (the research database's stack)
    directory: "/deploy/database"
    schedule:
      interval: monthly
    labels: ["dependency-updates"]
    ignore:
      # Watchtower already follows the floating tags within their line (16-3.6, pgAdmin 9); a PR is
      # only wanted for Watchtower's own pin, and never PostgreSQL 17+ (the pipeline's pg_dump is 16)
      - dependency-name: "postgis/postgis"
      - dependency-name: "dpage/pgadmin4"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependency-updates"]
